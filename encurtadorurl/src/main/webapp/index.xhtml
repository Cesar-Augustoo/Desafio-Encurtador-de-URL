<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>Encurtador de URL</title>

        <style>

            body {
                font-family: Arial, Helvetica, sans-serif;
                margin: 40px;
                background: #f5f5f5;
            }

            .container {
                width: 900px;
                margin: auto;
                background: white;
                padding: 25px;
                border-radius: 8px;
                box-shadow: 0 0 10px #ccc;
            }

            .campo {
                width: 500px;
            }

            .resultado {
                margin-top: 20px;
            }

        </style>

        <script type="text/javascript">
            function copiarUrl(url) {
                navigator.clipboard.writeText(url).then(function () {
                    PF('msgs').renderMessage({
                        severity: 'info',
                        summary: 'Copiado',
                        detail: 'A URL foi copiada para a área de transferência.'
                    });
                });
            }
        </script>

    </h:head>

    <h:body>
        <p:panel styleClass="container">
            <h2>Encurtador de URL</h2>
            <h:form id="form">
                <p:growl
                    id="mensagens"
                    widgetVar="msgs"
                    showDetail="true"
                    life="2500"/>
                
                <p:confirmDialog
                    global="true"
                    showEffect="fade"
                    hideEffect="fade"
                    responsive="true"
                    width="350">

                    <p:commandButton
                        value="Sim"
                        type="button"
                        styleClass="ui-confirmdialog-yes ui-button-danger"
                        icon="pi pi-check"/>

                    <p:commandButton
                        value="Não"
                        type="button"
                        styleClass="ui-confirmdialog-no ui-button-secondary"
                        icon="pi pi-times"/>

                </p:confirmDialog>

                <p:panel header="Nova URL">
                    <p:panelGrid 
                        columns="2"
                        styleClass="ui-panelgrid-blank"
                        style="width:100%">

                        <p:outputLabel value="URL:" />

                        <p:inputText
                            value="#{urlMB.url.urlOriginal}"
                            styleClass="campo"/>

                        <p:outputLabel value="Alias (opcional):"/>

                        <p:inputText
                            value="#{urlMB.url.codigo}"
                            maxlength="10"
                            style="width:200px"/>
                    </p:panelGrid>
                    <br/>
                    <p:commandButton
                        value="Encurtar"
                        icon="pi pi-link"
                        action="#{urlMB.salvar}"
                        update="form"
                        styleClass="ui-button-success"/>
                    
                    <p:spacer width="40"/>
                        
                    <p:commandButton
                        value="Excluir Todas"
                        icon="pi pi-trash"
                        action="#{urlMB.excluirTodas}"
                        update="form"
                        styleClass="ui-button-danger">

                        <p:confirm
                            header="Confirmação"
                            message="Deseja realmente excluir todas as URLs cadastradas?"
                            icon="pi pi-exclamation-triangle"/>

                    </p:commandButton>
                </p:panel>
                
                <p:outputPanel
                    rendered="#{not empty urlMB.ultimaUrlGerada}"
                    style="margin-top:20px">

                    <p:panel header="URL encurtada criada com sucesso">

                        <p:inputText
                            value="#{urlMB.ultimaUrlGerada}"
                            readonly="true"
                            style="width:420px"/>

                        <p:spacer width="10"/>

                        <p:commandButton
                            type="button"
                            value="Copiar"
                            icon="pi pi-copy"
                            onclick="copiarUrl('#{urlMB.ultimaUrlGerada}')"/>

                    </p:panel>
                </p:outputPanel>
            </h:form>
        </p:panel>
    </h:body>
</html>

<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>URL não encontrada</title>

        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

        <style>

            body{
                margin:0;
                font-family:Arial, Helvetica, sans-serif;
                background:#f4f6f9;
                display:flex;
                justify-content:center;
                align-items:center;
                height:100vh;
            }

            .card{
                width:500px;
                background:white;
                padding:40px;
                border-radius:10px;
                box-shadow:0 4px 15px rgba(0,0,0,.15);
                text-align:center;
            }

            .icone{
                font-size:70px;
                margin-bottom:20px;
            }

            h1{
                margin:0;
                color:#dc3545;
                font-size:28px;
            }

            p{
                color:#555;
                font-size:16px;
                line-height:1.6;
                margin-top:20px;
            }

            a{
                display:inline-block;
                margin-top:30px;
                padding:12px 24px;
                background:#0d6efd;
                color:white;
                text-decoration:none;
                border-radius:6px;
                transition:.2s;
            }

            a:hover{
                background:#0b5ed7;
            }

        </style>

    </head>

    <body>
        <div class="card">
            <div class="icone">🔗</div>
            <h1>URL não encontrada</h1>
            <p>
                O link informado não existe ou foi removido.
                <br/><br/>
                Verifique se a URL foi digitada corretamente ou solicite um novo link.
            </p>

            <a href="index.xhtml">
                Voltar ao Encurtador
            </a>

        </div>
    </body>
</html>
